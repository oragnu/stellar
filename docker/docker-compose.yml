# Primary self-host recipe — see docs/deployment/docker.md.
#
#   cp .env.example .env   # from repo root, then fill in secrets
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --build
#
# Put your own reverse proxy (Caddy/Traefik/nginx/NPM) in front of the
# `app` service for TLS — this compose file does not terminate TLS itself.
#
# NOTE on --env-file: `-f docker/docker-compose.yml` puts the Compose
# *project directory* at docker/, so Compose's own variable substitution
# (e.g. ${POSTGRES_PASSWORD:-changeme} below) looks for docker/.env by
# default — NOT the repo-root .env the command above just created. That's
# separate from the `app` service's `env_file: ../.env`, which is resolved
# relative to this file and finds the repo-root .env just fine. Without
# --env-file .env (resolved relative to the CWD you run this from, i.e.
# the repo root), the `db` service silently falls back to `changeme` while
# `app` connects with whatever password is actually in .env — a permanent
# "password authentication failed" loop. Always pass --env-file .env.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/oragnu/stellar:latest
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stellar
      POSTGRES_USER: stellar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - stellar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional, off by default — see docs/adr/0003-apscheduler-no-redis-by-default.md.
  # Enable with: docker compose --profile redis up -d
  # and set CACHE_BACKEND=redis / RATE_LIMIT_STORAGE_URI=redis://redis:6379/0 in .env.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped

volumes:
  stellar_db_data:
