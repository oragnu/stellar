name: frontend-ci

on:
  # No path filter here (unlike push, below): this is a required status
  # check on main's branch protection, so it must run on every PR
  # regardless of what changed — a path-filtered pull_request trigger
  # would mean PRs that don't touch frontend/ never get this check
  # reported at all, leaving them permanently unmergeable.
  pull_request:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: frontend-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npx tsc -b

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build
