name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stellar_test
          POSTGRES_USER: stellar
          POSTGRES_PASSWORD: stellar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stellar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://stellar:stellar@localhost:5432/stellar_test
      SECRET_KEY: ci-test-secret-key
      SECRET_ENCRYPTION_KEY: ci-test-encryption-key
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Run migrations against Postgres
        run: uv run alembic upgrade head

      - name: Test (pytest)
        run: uv run pytest --cov=app --cov-report=term-missing
